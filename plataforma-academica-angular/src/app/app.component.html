<!-- Navbar no topo (aparece sempre quando logado) -->
<app-navbar *ngIf="isLoggedIn"></app-navbar>

<!-- Layout para salas com sidebar -->
<div *ngIf="isSalaPage && isLoggedIn" class="sala-layout">
  <div class="sala-layout-main">
    <app-sala-sidebar></app-sala-sidebar>
    <div class="sala-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<!-- Layout normal para outras páginas -->
<div *ngIf="!isSalaPage" [class.with-navbar]="isLoggedIn">
  <router-outlet></router-outlet>
</div>

<!-- Chat Flutuante -->
<app-chat-flutuante *ngIf="isLoggedIn"></app-chat-flutuante>
