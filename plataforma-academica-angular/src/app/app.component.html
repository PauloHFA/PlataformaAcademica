<!-- Header Moderno no topo (sempre visível) -->
<app-header-modern></app-header-modern>

<!-- Layout para salas com sidebar -->
<div *ngIf="isSalaPage && isLoggedIn" class="sala-layout">
  <div class="sala-layout-main">
    <app-sala-sidebar></app-sala-sidebar>
    <div class="sala-content" [@routeAnimations]>
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<!-- Layout normal para outras páginas -->
<div *ngIf="!isSalaPage" [class.with-navbar]="isLoggedIn" [@routeAnimations]>
  <router-outlet></router-outlet>
</div>

<!-- Chat Flutuante -->
<app-chat-flutuante *ngIf="isLoggedIn"></app-chat-flutuante>
