<!-- Header Moderno (apenas visível nas páginas públicas / quando deslogado) -->
<app-header-modern *ngIf="!isLoggedIn" [isLoggedIn]="isAuthenticated" [usuarioNome]="usuarioNome"></app-header-modern>

<!-- Layout Raiz Autenticado com Sidebar Fixa, Conteúdo Principal e Painel Direito de Conexões -->
<div class="main-layout" *ngIf="isLoggedIn" [class.focus-mode]="isFocusMode">
  <app-sidebar *ngIf="!isFocusMode"></app-sidebar>
  <main class="main-content" [class.full-width]="isFocusMode">
    <router-outlet></router-outlet>
  </main>
  <app-connections-panel *ngIf="!isFocusMode"></app-connections-panel>
  <app-command-palette></app-command-palette>
</div>

<!-- Layout normal para quando não está logado -->
<div class="public-layout" *ngIf="!isLoggedIn" [@routeAnimations]>
  <router-outlet></router-outlet>
</div>

<!-- Chat Flutuante (apenas autenticado) -->
<app-chat-flutuante *ngIf="isLoggedIn"></app-chat-flutuante>
