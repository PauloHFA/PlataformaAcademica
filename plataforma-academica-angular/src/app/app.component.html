<!-- Botão de toggle do tema -->
<app-theme-toggle></app-theme-toggle>

<!-- Notificações -->
<app-notificacoes *ngIf="isLoggedIn"></app-notificacoes>

<!-- Exibir Sidebar apenas se logado -->
<app-sidebar *ngIf="isLoggedIn"></app-sidebar>

<!-- Container principal com margem se sidebar estiver visível -->
<div [class.with-sidebar]="isLoggedIn">
  <!-- Onde os componentes vão ser renderizados -->
  <router-outlet></router-outlet>
</div>
