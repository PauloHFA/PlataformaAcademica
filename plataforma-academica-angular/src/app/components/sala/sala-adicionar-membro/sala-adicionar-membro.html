<div class="adicionar-membro">
  <h3>Adicionar Membro</h3>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label for="membroId">ID do Usuário</label>
    <input id="membroId" formControlName="membroId" />
    <div class="actions">
      <button type="submit" [disabled]="carregando">Adicionar</button>
      <a routerLink="/salas" class="btn-cancel">Cancelar</a>
    </div>
  </form>
  <div *ngIf="mensagem" class="mensagem">{{ mensagem }}</div>
</div>
