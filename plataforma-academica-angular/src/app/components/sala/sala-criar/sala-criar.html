<div class="sala-criar">
  <h2>Criar Sala de Aula</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group">
      <label for="nome">Nome da Sala</label>
      <input 
        id="nome" 
        formControlName="nome" 
        placeholder="Ex: Matemática Avançada"
        class="form-control"
      />
      <div *ngIf="form.controls['nome'].invalid && (form.controls['nome'].dirty || form.controls['nome'].touched)" class="erro">
        Nome é obrigatório (mínimo 3 caracteres).
      </div>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="carregando || form.invalid" class="btn-primary">
        {{ carregando ? 'Criando...' : 'Criar Sala' }}
      </button>
      <a routerLink="/salas" class="btn-cancel">Cancelar</a>
    </div>
  </form>

  <div *ngIf="mensagem" class="mensagem" [class.sucesso]="!mensagem.includes('Erro')">{{ mensagem }}</div>
</div>
