# ============================================
# CONFIGURAÇÃO OAUTH2 - LOGIN SOCIAL
# ============================================
# 
# INSTRUÇÕES:
# 1. Copie este arquivo para application.properties
# 2. Substitua os valores COLOQUE_AQUI pelas suas credenciais reais
# 3. Siga o guia em CONFIGURACAO_LOGIN_SOCIAL.md
#

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=COLOQUE_SEU_GOOGLE_CLIENT_ID_AQUI
spring.security.oauth2.client.registration.google.client-secret=COLOQUE_SEU_GOOGLE_CLIENT_SECRET_AQUI
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# Facebook OAuth2
spring.security.oauth2.client.registration.facebook.client-id=COLOQUE_SEU_FACEBOOK_APP_ID_AQUI
spring.security.oauth2.client.registration.facebook.client-secret=COLOQUE_SEU_FACEBOOK_APP_SECRET_AQUI
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/facebook

# CORS
spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
