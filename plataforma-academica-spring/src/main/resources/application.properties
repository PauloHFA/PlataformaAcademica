# DATASOURCE (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/plataforma_academica
spring.datasource.username=postgres
spring.datasource.password=phfa1996
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SERVER
server.port=8090

# ACTUATOR - Health Checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.info.env.enabled=true

# Configurar recurso estático para servir arquivos enviados
# Observação: estamos salvando em ./uploads e mapeando /uploads/** para este diretório
spring.web.resources.static-locations=file:uploads/,classpath:/static/

# SPRING MVC - Garantir que controllers REST tenham prioridade
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/

# Email e URL pública. Credenciais devem vir de variáveis de ambiente.
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
